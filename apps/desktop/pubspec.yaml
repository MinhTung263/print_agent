name: print_agent_desktop
description: "EasyPOS Print Agent — in ESC/POS qua LAN, không cần driver (Windows/Linux/macOS)."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  crypto: ^3.0.8
  encrypt: ^5.0.3
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  launch_at_startup: ^0.5.1
  mqtt_client: ^10.14.0
  get: ^4.7.3
  print_agent:
    path: ../../packages/print_agent
  print_agent_core:
    path: ../../packages/print_agent_core
  printer_label:
    git:
      url: https://github.com/MinhTung263/printer_label.git
      ref: feature/print-agent
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # tool/gen_tray_icon.dart, tool/gen_app_icon.dart (biểu tượng khay / app).
  image: ^4.5.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app/
    - assets/tray/
