<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thử in web qua Trạm in</title>
<style>
  :root { --primary:#0074BD; --bg:#F4F6F8; --card:#fff; --text:#1F2933; --muted:#667085; --ok:#12805C; --err:#C0392B; --border:#D8DEE4; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 4px; }
  p.sub { color:var(--muted); margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; }
  label { display:block; font-weight:600; margin:0 0 6px; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  input, select { width:100%; height:44px; border:1px solid var(--border); border-radius:8px; padding:0 12px; font-size:15px; background:#fff; }
  .field { margin-bottom:12px; }
  button { height:44px; border:0; border-radius:8px; padding:0 16px; font-size:15px; font-weight:600; cursor:pointer; }
  .primary { background:var(--primary); color:#fff; }
  .ghost { background:#E8F1F8; color:var(--primary); }
  button:disabled { opacity:.5; cursor:default; }
  .actions { display:flex; gap:8px; }
  .actions button { flex:1; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700; }
  .pill.ok { background:#E3F5EE; color:var(--ok); } .pill.err { background:#FBE9E7; color:var(--err); }
  pre { background:#0F172A; color:#E2E8F0; border-radius:8px; padding:12px; overflow:auto; font-size:12px; margin:8px 0 0; max-height:260px; }
  canvas { max-width:100%; border:1px dashed var(--border); border-radius:8px; background:#fff; }
  .hint { color:var(--muted); font-size:12px; margin-top:6px; }
</style>
</head>
<body>
<main>
  <h1>Thử in web qua Trạm in</h1>
  <p class="sub">Trang này gọi cổng web của thiết bị đang bật Trạm in, giống cách trang EasyPOS sẽ in.</p>

  <div class="card">
    <div class="field">
      <label for="host">Địa chỉ thiết bị bật Trạm in</label>
      <div class="row">
        <input id="host" placeholder="192.168.1.50" inputmode="decimal" style="flex:3">
        <input id="port" value="9102" inputmode="numeric" style="flex:1">
      </div>
      <div class="hint">IP của máy T4s trong cùng Wi-Fi (Cài đặt → Wi-Fi). Cổng mặc định 9102.</div>
    </div>
    <div class="actions">
      <button class="ghost" id="btnInfo">Kiểm tra kết nối</button>
    </div>
    <div id="status" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <div class="row field">
      <div><label for="paper">Khổ giấy</label>
        <select id="paper"><option value="">Theo máy</option><option value="size58">58mm</option><option value="size80">80mm</option></select></div>
      <div><label for="copies">Số bản</label><input id="copies" type="number" min="1" max="10" value="1"></div>
    </div>
    <div class="field">
      <label><input type="checkbox" id="beep" style="width:auto;height:auto"> Kêu còi (phiếu bếp)</label>
    </div>
    <canvas id="cv"></canvas>
    <div class="actions" style="margin-top:12px">
      <button class="primary" id="btnPrint">In thử ra máy in tích hợp</button>
    </div>
    <div class="hint">Bấm 2 lần cùng một phiếu sẽ chỉ in 1 lần (chống in đúp theo mã lệnh).</div>
    <pre id="log">Chưa có kết quả.</pre>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const saved = localStorage.getItem('agentHost'); if (saved) $('host').value = saved;
const base = () => `http://${$('host').value.trim()}:${$('port').value.trim() || 9102}`;
const log = (x) => { $('log').textContent = typeof x === 'string' ? x : JSON.stringify(x, null, 2); };
const pill = (ok, t) => `<span class="pill ${ok ? 'ok' : 'err'}">${t}</span>`;

function receipt(seq) {
  const cv = $('cv'), W = 384, ctx = cv.getContext('2d');
  const lines = [
    ['QUÁN CÀ PHÊ EASYPOS', 'bold 20px sans-serif', 'center'],
    ['Phiếu in thử từ trang web', '13px sans-serif', 'center'],
    ['Số HĐ: TEST-' + seq + '   Bàn: 05', '13px sans-serif', 'left'],
    [new Date().toLocaleString('vi-VN'), '12px sans-serif', 'left'],
    ['------------------------------------', '13px monospace', 'left'],
    ['Cà phê sữa đá (size L)   2   58.000', '14px sans-serif', 'left'],
    ['Trà đào cam sả ít đường  1   45.000', '14px sans-serif', 'left'],
    ['Ghi chú: không đá, thêm trân châu', 'italic 11px sans-serif', 'left'],
    ['------------------------------------', '13px monospace', 'left'],
    ['Tổng cộng            103.000đ', 'bold 17px sans-serif', 'left'],
    ['Cảm ơn quý khách - Hẹn gặp lại!', '12px sans-serif', 'center'],
  ];
  const H = lines.length * 28 + 24;
  cv.width = W; cv.height = H;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#000'; ctx.textBaseline = 'middle';
  lines.forEach(([t, f, a], i) => {
    ctx.font = f; ctx.textAlign = a;
    ctx.fillText(t, a === 'center' ? W / 2 : 6, 24 + i * 28);
  });
}
let seq = Date.now().toString(36);
receipt(seq);

async function call(path, init) {
  localStorage.setItem('agentHost', $('host').value.trim());
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 20000);
  try { const r = await fetch(base() + path, { ...init, signal: ctl.signal }); return await r.json(); }
  finally { clearTimeout(t); }
}

$('btnInfo').onclick = async () => {
  $('status').innerHTML = 'Đang kiểm tra…';
  try {
    const i = await call('/v1/info');
    log(i);
    const ok = i.on && (i.printers || []).length > 0;
    $('status').innerHTML = pill(ok, ok ? 'Sẵn sàng in' : (i.on ? 'Chưa có máy in' : 'Trạm in đang tắt')) +
      ` &nbsp;${i.name || ''} · khổ ${i.paper || '?'} · ${(i.printers || []).map(p => p.name).join(', ') || 'không có máy in'}`;
  } catch (e) {
    $('status').innerHTML = pill(false, 'Không kết nối được') +
      ' Kiểm tra IP, Trạm in đã bật, cùng Wi-Fi và trang đang chạy bằng http (không phải https).';
    log(String(e));
  }
};

$('btnPrint').onclick = async () => {
  const b = $('btnPrint'); b.disabled = true;
  try {
    const dataUrl = $('cv').toDataURL('image/png');
    const body = { jobId: 'TEST-' + seq + '-1', image: dataUrl, printer: 'builtin',
      copies: +$('copies').value || 1, beep: $('beep').checked, sender: 'Trang thử web' };
    if ($('paper').value) body.paper = $('paper').value;
    const t0 = performance.now();
    const r = await call('/v1/print', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    log({ ...r, thoiGianMs: Math.round(performance.now() - t0) });
    // Mỗi lần bấm sau kết quả "done" là một phiếu mới.
    if (r.status === 'done') { seq = Date.now().toString(36); receipt(seq); }
  } catch (e) { log('Lỗi: ' + e); }
  finally { b.disabled = false; }
};
</script>
</body>
</html>
