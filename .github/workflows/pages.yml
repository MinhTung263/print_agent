# Đưa trang thử in (docs/) lên GitHub Pages. Bật một lần: Settings → Pages →
# Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test docs/test/relay.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Đóng dấu bản (đổi ngay khi tải lại, khỏi chờ bộ nhớ đệm 10 phút)
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$V/g" docs/index.html
          echo "{\"v\":\"$V\"}" > docs/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
